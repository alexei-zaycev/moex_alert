version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moex_alert_postgres
    env_file:
      - docker.env
    environment:
      POSTGRES_DB: ${DB_NAME:-moex_alert}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-moex_alert}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: moex-alert-app
    container_name: moex_alert_app
    env_file:
      - docker.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-moex_alert}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-secret}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "http://localhost:8080/api/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: on-failure

volumes:
  postgres_data:
    name: moex_alert_postgres_data
